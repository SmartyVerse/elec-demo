<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#182A44"/>
    </linearGradient>
    <pattern id="pGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#233B5D" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#p1Bg)"/>
  <rect width="600" height="400" fill="url(#pGrid)"/>
  
  <!-- Architectural schematic of a modern home with circuit conduits -->
  <g stroke="#00C2FF" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <!-- Home outline -->
    <path d="M 120 280 L 120 170 L 300 90 L 480 170 L 480 280 Z"/>
    <path d="M 230 280 L 230 210 L 370 210 L 370 280"/>
    <line x1="120" y1="170" x2="480" y2="170"/>
    <line x1="300" y1="90" x2="300" y2="170"/>
  </g>

  <!-- Electrical distribution wiring in gold -->
  <g stroke="#F5B91C" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <!-- Main conduit path -->
    <path d="M 160 280 L 160 230 L 250 230 L 250 140 L 350 140 L 350 190 L 440 190 L 440 280"/>
  </g>

  <!-- Electrical Node symbols -->
  <g fill="#F5B91C">
    <circle cx="160" cy="230" r="5"/>
    <circle cx="250" cy="140" r="5"/>
    <circle cx="350" cy="140" r="5"/>
    <circle cx="440" cy="190" r="5"/>
    <circle cx="300" cy="90" r="6" fill="#00C2FF"/>
  </g>

  <!-- Distribution Box indicator -->
  <rect x="145" y="240" width="30" height="40" rx="3" fill="#13233A" stroke="#F5B91C" stroke-width="1.5"/>
  <text x="160" y="265" fill="#F5B91C" font-size="10" font-family="monospace" text-anchor="middle">MDB</text>

  <!-- Overlay Watermark Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="26" rx="13" fill="#0A121F" stroke="#F5B91C" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="15" cy="13" r="4" fill="#F5B91C"/>
    <text x="28" y="17" fill="#F5B91C" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="1">SAMPLE PROJECT</text>
  </g>

  <!-- Bottom Details Bar -->
  <rect x="0" y="340" width="600" height="60" fill="#0A121F" fill-opacity="0.9"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#253C5E" stroke-width="1"/>
  <text x="30" y="366" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Modern Home Electrical Installation</text>
  <text x="30" y="384" fill="#8FA4C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Whole-house concealed conduit wiring &amp; smart distribution</text>
  <text x="570" y="375" fill="#F5B91C" font-family="monospace" font-size="12" text-anchor="end">RESIDENTIAL</text>
</svg>
