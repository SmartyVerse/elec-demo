<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#142135"/>
    </linearGradient>
    <pattern id="pGrid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#233B5D" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#p3Bg)"/>
  <rect width="600" height="400" fill="url(#pGrid3)"/>
  
  <!-- High Bay Warehouse Trusses & High-bay fixtures -->
  <g stroke="#2C4468" stroke-width="2" fill="none">
    <path d="M 50 290 L 50 120 L 300 70 L 550 120 L 550 290"/>
    <path d="M 50 120 L 550 120"/>
    <!-- Truss struts -->
    <path d="M 120 120 L 150 100 L 180 120 L 220 90 L 260 120 L 300 70 L 340 120 L 380 90 L 420 120 L 450 100 L 480 120"/>
  </g>

  <!-- Heavy cable trays suspended -->
  <line x1="100" y1="150" x2="500" y2="150" stroke="#F5B91C" stroke-width="3"/>
  <line x1="100" y1="154" x2="500" y2="154" stroke="#DFA30D" stroke-width="1"/>

  <!-- High-Bay LED luminaires projecting light cones -->
  <g>
    <!-- Light cone 1 -->
    <polygon points="175,165 110,290 240,290" fill="#00C2FF" fill-opacity="0.12"/>
    <rect x="160" y="150" width="30" height="15" rx="3" fill="#15243B" stroke="#00C2FF" stroke-width="1.5"/>
    <!-- Light cone 2 -->
    <polygon points="300,165 235,290 365,290" fill="#F5B91C" fill-opacity="0.15"/>
    <rect x="285" y="150" width="30" height="15" rx="3" fill="#15243B" stroke="#F5B91C" stroke-width="1.5"/>
    <!-- Light cone 3 -->
    <polygon points="425,165 360,290 490,290" fill="#00C2FF" fill-opacity="0.12"/>
    <rect x="410" y="150" width="30" height="15" rx="3" fill="#15243B" stroke="#00C2FF" stroke-width="1.5"/>
  </g>

  <!-- Warehouse industrial racks schematic -->
  <g stroke="#243852" stroke-width="1.5" fill="none">
    <rect x="70" y="210" width="60" height="80"/>
    <line x1="70" y1="240" x2="130" y2="240"/>
    <line x1="70" y1="265" x2="130" y2="265"/>
    <rect x="470" y="210" width="60" height="80"/>
    <line x1="470" y1="240" x2="530" y2="240"/>
    <line x1="470" y1="265" x2="530" y2="265"/>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="26" rx="13" fill="#0A121F" stroke="#F5B91C" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="15" cy="13" r="4" fill="#F5B91C"/>
    <text x="28" y="17" fill="#F5B91C" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="1">SAMPLE PROJECT</text>
  </g>

  <!-- Bottom Details Bar -->
  <rect x="0" y="340" width="600" height="60" fill="#0A121F" fill-opacity="0.9"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#253C5E" stroke-width="1"/>
  <text x="30" y="366" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Warehouse Lighting &amp; Power Upgrade</text>
  <text x="30" y="384" fill="#8FA4C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Heavy-duty cable trays, high-bay LEDs &amp; emergency circuits</text>
  <text x="570" y="375" fill="#F5B91C" font-family="monospace" font-size="12" text-anchor="end">WAREHOUSE</text>
</svg>
