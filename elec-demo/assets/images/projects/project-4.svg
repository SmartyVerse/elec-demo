<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#15243B"/>
    </linearGradient>
    <pattern id="pGrid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#233B5D" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#p4Bg)"/>
  <rect width="600" height="400" fill="url(#pGrid4)"/>
  
  <!-- Network Topology and Surveillance Cameras -->
  <!-- Central NVR Server Rack -->
  <g transform="translate(140, 150)">
    <rect x="-35" y="-50" width="70" height="110" rx="4" fill="#132238" stroke="#00C2FF" stroke-width="2"/>
    <line x1="-25" y1="-30" x2="25" y2="-30" stroke="#00C2FF" stroke-width="1.5"/>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#00C2FF" stroke-width="1.5"/>
    <line x1="-25" y1="10" x2="25" y2="10" stroke="#00C2FF" stroke-width="1.5"/>
    <line x1="-25" y1="30" x2="25" y2="30" stroke="#00C2FF" stroke-width="1.5"/>
    <circle cx="20" cy="-30" r="2" fill="#22C55E"/>
    <circle cx="20" cy="-10" r="2" fill="#22C55E"/>
    <circle cx="20" cy="10" r="2" fill="#22C55E"/>
    <text x="0" y="52" fill="#8FA4C4" font-size="9" font-family="monospace" text-anchor="middle">PoE NVR</text>
  </g>

  <!-- Network lines to IP Cameras -->
  <g stroke="#00C2FF" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <path d="M 175 120 L 300 120 L 400 90"/>
    <path d="M 175 140 L 330 140 L 450 170"/>
    <path d="M 175 160 L 300 160 L 410 240"/>
  </g>

  <!-- Camera 1 -->
  <g transform="translate(400, 90)">
    <polygon points="0,0 70,-40 70,40" fill="#00C2FF" fill-opacity="0.1"/>
    <path d="M -15 -8 L 15 -14 L 15 14 L -15 8 Z" fill="#15243B" stroke="#F5B91C" stroke-width="1.5"/>
    <circle cx="15" cy="0" r="8" fill="#15243B" stroke="#00C2FF" stroke-width="1.5"/>
    <circle cx="15" cy="0" r="3" fill="#EF4444"/>
    <text x="25" y="24" fill="#F5B91C" font-size="9" font-family="monospace">CAM-01 4K</text>
  </g>

  <!-- Camera 2 -->
  <g transform="translate(450, 170)">
    <polygon points="0,0 70,-30 70,30" fill="#F5B91C" fill-opacity="0.1"/>
    <path d="M -15 -8 L 15 -14 L 15 14 L -15 8 Z" fill="#15243B" stroke="#F5B91C" stroke-width="1.5"/>
    <circle cx="15" cy="0" r="8" fill="#15243B" stroke="#F5B91C" stroke-width="1.5"/>
    <circle cx="15" cy="0" r="3" fill="#EF4444"/>
    <text x="25" y="24" fill="#F5B91C" font-size="9" font-family="monospace">CAM-02 4K</text>
  </g>

  <!-- Camera 3 -->
  <g transform="translate(410, 240)">
    <polygon points="0,0 70,-40 70,40" fill="#00C2FF" fill-opacity="0.1"/>
    <path d="M -15 -8 L 15 -14 L 15 14 L -15 8 Z" fill="#15243B" stroke="#F5B91C" stroke-width="1.5"/>
    <circle cx="15" cy="0" r="8" fill="#15243B" stroke="#00C2FF" stroke-width="1.5"/>
    <circle cx="15" cy="0" r="3" fill="#EF4444"/>
    <text x="25" y="24" fill="#F5B91C" font-size="9" font-family="monospace">CAM-03 4K</text>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="26" rx="13" fill="#0A121F" stroke="#F5B91C" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="15" cy="13" r="4" fill="#F5B91C"/>
    <text x="28" y="17" fill="#F5B91C" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="1">SAMPLE PROJECT</text>
  </g>

  <!-- Bottom Details Bar -->
  <rect x="0" y="340" width="600" height="60" fill="#0A121F" fill-opacity="0.9"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#253C5E" stroke-width="1"/>
  <text x="30" y="366" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">CCTV &amp; Surveillance Infrastructure</text>
  <text x="30" y="384" fill="#8FA4C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Structured Cat6 cabling, PoE switches, 4K cameras &amp; remote monitoring</text>
  <text x="570" y="375" fill="#00C2FF" font-family="monospace" font-size="12" text-anchor="end">CCTV / OTHER</text>
</svg>
