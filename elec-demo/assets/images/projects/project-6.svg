<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#18273E"/>
    </linearGradient>
    <pattern id="pGrid6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#233B5D" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#p6Bg)"/>
  <rect width="600" height="400" fill="url(#pGrid6)"/>
  
  <!-- Electrical Panel Inspection & Switchgear Servicing Schematic -->
  <g transform="translate(160, 80)">
    <!-- Main Switchgear Cabinet -->
    <rect x="0" y="0" width="280" height="220" rx="6" fill="#121F33" stroke="#2B4366" stroke-width="2"/>
    <line x1="0" y1="40" x2="280" y2="40" stroke="#2B4366" stroke-width="1.5"/>
    <text x="20" y="26" fill="#8FA4C4" font-size="11" font-family="monospace">MAIN DISTRIBUTION BOARD (MDB-01)</text>

    <!-- Circuit Breaker banks (MCBs / MCCBs) -->
    <g fill="#172840" stroke="#00C2FF" stroke-width="1.2">
      <!-- Row 1 -->
      <rect x="25" y="60" width="35" height="55" rx="3"/>
      <rect x="75" y="60" width="35" height="55" rx="3"/>
      <rect x="125" y="60" width="35" height="55" rx="3"/>
      <rect x="175" y="60" width="35" height="55" rx="3"/>
      <rect x="225" y="60" width="35" height="55" rx="3"/>
      <!-- Toggles & Status LEDs -->
      <circle cx="42" cy="72" r="3" fill="#22C55E"/>
      <circle cx="92" cy="72" r="3" fill="#22C55E"/>
      <circle cx="142" cy="72" r="3" fill="#22C55E"/>
      <circle cx="192" cy="72" r="3" fill="#22C55E"/>
      <circle cx="242" cy="72" r="3" fill="#22C55E"/>
      <rect x="36" y="85" width="12" height="20" rx="2" fill="#F5B91C"/>
      <rect x="86" y="85" width="12" height="20" rx="2" fill="#F5B91C"/>
      <rect x="136" y="85" width="12" height="20" rx="2" fill="#F5B91C"/>
      <rect x="186" y="85" width="12" height="20" rx="2" fill="#F5B91C"/>
      <rect x="236" y="85" width="12" height="20" rx="2" fill="#F5B91C"/>
    </g>

    <!-- Thermal Scan Crosshairs overlay -->
    <g transform="translate(140, 150)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 2"/>
      <line x1="-45" y1="0" x2="45" y2="0" stroke="#EF4444" stroke-width="1"/>
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#EF4444" stroke-width="1"/>
      <text x="45" y="-10" fill="#EF4444" font-size="9" font-family="monospace">THERMAL TEST: 28.4°C [PASS]</text>
    </g>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="26" rx="13" fill="#0A121F" stroke="#F5B91C" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="15" cy="13" r="4" fill="#F5B91C"/>
    <text x="28" y="17" fill="#F5B91C" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="1">SAMPLE PROJECT</text>
  </g>

  <!-- Bottom Details Bar -->
  <rect x="0" y="340" width="600" height="60" fill="#0A121F" fill-opacity="0.9"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#253C5E" stroke-width="1"/>
  <text x="30" y="366" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Annual Switchgear &amp; Panel Maintenance (AMC)</text>
  <text x="30" y="384" fill="#8FA4C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Thermographic testing, contact torque tightening &amp; earth resistance logging</text>
  <text x="570" y="375" fill="#F5B91C" font-family="monospace" font-size="12" text-anchor="end">MAINTENANCE</text>
</svg>
