<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1524"/>
      <stop offset="100%" stop-color="#142236"/>
    </linearGradient>
    <pattern id="pGrid5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#233B5D" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#p5Bg)"/>
  <rect width="600" height="400" fill="url(#pGrid5)"/>
  
  <!-- Architectural Facade & Landscape pathway -->
  <path d="M 80 280 L 80 140 L 280 140 L 280 180 L 520 180 L 520 280 Z" fill="#101C2E" stroke="#253D60" stroke-width="1.5"/>
  
  <!-- Pathway perspective lines -->
  <path d="M 220 280 L 270 200 L 330 200 L 380 280 Z" fill="#14243B" stroke="#233956" stroke-width="1"/>

  <!-- Warm Outdoor Bollard & Facade Uplighters -->
  <!-- Uplighter cones on facade -->
  <g>
    <!-- Uplighter 1 -->
    <polygon points="120,280 90,150 150,150" fill="#F5B91C" fill-opacity="0.2"/>
    <circle cx="120" cy="278" r="4" fill="#F5B91C"/>
    <!-- Uplighter 2 -->
    <polygon points="200,280 170,150 230,150" fill="#F5B91C" fill-opacity="0.2"/>
    <circle cx="200" cy="278" r="4" fill="#F5B91C"/>
    <!-- Uplighter 3 -->
    <polygon points="400,280 370,190 430,190" fill="#F5B91C" fill-opacity="0.2"/>
    <circle cx="400" cy="278" r="4" fill="#F5B91C"/>
    <!-- Uplighter 4 -->
    <polygon points="480,280 450,190 510,190" fill="#F5B91C" fill-opacity="0.2"/>
    <circle cx="480" cy="278" r="4" fill="#F5B91C"/>
  </g>

  <!-- Pathway Bollard Lights -->
  <g fill="#00C2FF">
    <ellipse cx="250" cy="225" rx="8" ry="4" fill="#00C2FF" fill-opacity="0.4"/>
    <rect x="248" y="215" width="4" height="12" fill="#00C2FF"/>
    <ellipse cx="350" cy="225" rx="8" ry="4" fill="#00C2FF" fill-opacity="0.4"/>
    <rect x="348" y="215" width="4" height="12" fill="#00C2FF"/>
    <ellipse cx="230" cy="265" rx="14" ry="6" fill="#00C2FF" fill-opacity="0.4"/>
    <rect x="228" y="250" width="4" height="16" fill="#00C2FF"/>
    <ellipse cx="370" cy="265" rx="14" ry="6" fill="#00C2FF" fill-opacity="0.4"/>
    <rect x="368" y="250" width="4" height="16" fill="#00C2FF"/>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="26" rx="13" fill="#0A121F" stroke="#F5B91C" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="15" cy="13" r="4" fill="#F5B91C"/>
    <text x="28" y="17" fill="#F5B91C" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" letter-spacing="1">SAMPLE PROJECT</text>
  </g>

  <!-- Bottom Details Bar -->
  <rect x="0" y="340" width="600" height="60" fill="#0A121F" fill-opacity="0.9"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#253C5E" stroke-width="1"/>
  <text x="30" y="366" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Architectural &amp; Outdoor Landscape Lighting</text>
  <text x="30" y="384" fill="#8FA4C4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">IP67 waterproof fixtures, automated timer controls &amp; facade uplighting</text>
  <text x="570" y="375" fill="#F5B91C" font-family="monospace" font-size="12" text-anchor="end">LIGHTING / OTHER</text>
</svg>
